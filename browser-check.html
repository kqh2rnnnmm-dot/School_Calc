<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Браузерная проверка v4.0</title><style>body{font:15px/1.5 system-ui;margin:16px;background:#f3f5f3;color:#1d302c}button{padding:12px;border:1px solid #abc5b4;border-radius:10px;background:white;font:inherit;cursor:pointer}#results p{padding:8px;border-radius:8px;background:white}.fail{color:#a22}.pass{color:#246b53}iframe{border:1px solid #abc5b4;display:block;width:375px;max-width:100%;height:850px;margin:16px 0;background:white}pre{white-space:pre-wrap}h1{font-size:24px}</style></head><body><h1>Браузерная проверка</h1><p>Эта проверка использует отдельную тестовую базу. Семейные записи приложения не меняются. Запускайте через локальный адрес, а не предпросмотр файла.</p><button id="run">Запустить проверки</button> <button id="wide">375 / 390 px</button><div id="summary" role="status"></div><div id="results"></div><iframe id="app" title="Тестовый калькулятор"></iframe><script>
'use strict';
const frame=document.getElementById('app'),output=document.getElementById('results'),summary=document.getElementById('summary');let html='',report=[];
const KEY='school-calculator-v4-browser-test',wait=()=>new Promise(r=>setTimeout(r,30));
const assert=(v,m='Проверка не пройдена')=>{if(!v)throw Error(m)};
function exec(s){return frame.contentWindow.eval(s)}
const doc=()=>frame.contentDocument,field=(id,v)=>{const e=doc().getElementById(id);e.value=v;e.dispatchEvent(new Event('change',{bubbles:true}));};
async function open(){await new Promise(r=>{frame.onload=r;frame.srcdoc=html.replaceAll('school-calculator-v4',KEY)});frame.contentWindow.confirm=()=>true;}
async function test(name,fn){try{await fn();report.push({name,passed:true});}catch(e){report.push({name,passed:false,error:e.message});}const p=document.createElement('p'),result=report.at(-1);p.className=result.passed?'pass':'fail';p.textContent=(result.passed?'✓ ':'✗ ')+name+(result.error?' — '+result.error:'');output.append(p);}
function seed(){exec(`db=C.initial();seenRaw=JSON.stringify(db);localStorage.setItem(KEY,seenRaw);date='2026-10-12';month='2026-10';page='home';undo=null;render()`)}
function click(selector){const e=doc().querySelector(selector);assert(e,'Кнопка не найдена: '+selector);e.click();}
function overflow(){const d=doc();return {width:d.documentElement.clientWidth,scroll:d.documentElement.scrollWidth};}
document.getElementById('wide').onclick=()=>frame.style.width=frame.style.width==='390px'?'375px':'390px';
document.getElementById('run').onclick=async()=>{const btn=document.getElementById('run');btn.disabled=true;report=[];output.innerHTML='';summary.textContent='Выполняются проверки…';try{html=await (await fetch('index.html',{cache:'no-store'})).text();localStorage.removeItem(KEY);localStorage.removeItem(KEY+'-before-import');await open();
await test('Нет JavaScript-ошибок при переходах по пяти разделам',async()=>{const errors=[];frame.contentWindow.addEventListener('error',e=>errors.push(e.message));for(const p of ['home','homework','grades','month','settings']){click('[data-page="'+p+'"]');await wait();assert(doc().querySelector('h1'),'Экран пуст');}assert(!errors.length,errors.join('; '));});
await test('На 375 и 390 px все экраны без горизонтальной прокрутки',async()=>{for(const width of [375,390]){frame.style.width=width+'px';for(const p of ['home','homework','grades','month','settings']){click('[data-page="'+p+'"]');await wait();const r=overflow();assert(r.scroll<=r.width,`${width} px, ${p}: ${r.scroll}>${r.width}`);}}});
await test('Начальный месяц не начисляет автоматически 2850 ₽',()=>{seed();assert(exec('C.calculate(db,month).s')===null);assert(doc().body.textContent.includes('Предварительная выплата'));});
await test('Задано → выполнено → подтверждено, без оценок 2850 ₽',()=>{seed();click('[data-page="homework"]');const e=exec("C.day(db,date).entries.find(e=>e.subjectId==='s2').id");click('[data-action="entry-status"][data-entry="'+e+'"][data-status="assigned"]');click('[data-action="task-status"][data-entry="'+e+'"][data-status="done"]');assert(exec('C.calculate(db,month).s')===0);click('[data-action="task-status"][data-entry="'+e+'"][data-status="confirmed"]');assert(exec('C.calculate(db,month).s')===2850);assert(doc().body.textContent.includes('Подтверждено родителем'));});
await test('Отмена подтверждения и быстрое отменить действие',()=>{const e=exec("C.day(db,date).entries.find(e=>e.subjectId==='s2').id");click('[data-action="task-status"][data-entry="'+e+'"][data-status="done"]');assert(exec('C.calculate(db,month).s')===0);click('[data-action="undo"]');assert(exec('C.calculate(db,month).s')===2850);});
await test('Сохранение после перезагрузки документа',async()=>{await open();assert(exec("C.calculate(db,'2026-10').h")===1);assert(exec("C.calculate(db,'2026-10').c")===1);});
await test('Несколько оценок в день, полный средний, форма и редактирование',()=>{exec("chooseDate('2026-10-12')");click('[data-page="grades"]');for(const value of ['5','4','5']){click('[data-action="grade-new"]');doc().getElementById('g-date').value='2026-10-12';doc().getElementById('g-subject').value='s1';doc().getElementById('g-value').value=value;doc().getElementById('g-comment').value='Классная работа';doc().getElementById('modal-form').requestSubmit();}assert(exec('db.grades.length')===3);assert(exec('C.calculate(db,month).g')===14/3);assert(exec('C.calculate(db,month).s')===2900);click('[data-action="grade-edit"]');doc().getElementById('g-value').value='4';doc().getElementById('modal-form').requestSubmit();assert(exec('db.grades.length')===3);});
await test('Удаление оценки с подтверждением, отмена удаления',()=>{click('[data-action="grade-edit"]');click('[data-action="grade-delete"]');assert(exec('db.grades.length')===2);click('[data-action="undo"]');assert(exec('db.grades.length')===3);});
await test('Реальный обработчик импорта JSON и копия перед импортом',async()=>{click('[data-page="settings"]');const saved=exec('JSON.stringify(db)');const altered=JSON.parse(saved);altered.settings.theme='dark';const input=doc().getElementById('import-file'),dt=new DataTransfer();dt.items.add(new File([JSON.stringify(altered)],'copy.json',{type:'application/json'}));input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));await wait();assert(doc().getElementById('modal').open);doc().getElementById('import-agree').checked=true;doc().getElementById('modal-form').requestSubmit();assert(exec('db.settings.theme')==='dark');assert(localStorage.getItem(KEY+'-before-import')===saved);});
await test('Некорректный импорт отклоняется, текущие данные сохраняются',async()=>{click('[data-page="settings"]');const before=exec('JSON.stringify(db)'),input=doc().getElementById('import-file'),dt=new DataTransfer();dt.items.add(new File(['{"schemaVersion":3}'],'broken.json',{type:'application/json'}));input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));await wait();assert(exec('JSON.stringify(db)')===before);assert(doc().getElementById('toast').textContent.includes('Импорт отклонён'));});
await test('Закрытие заполненного сентября через диалог, блокировка изменений',()=>{exec(`db=C.initial();for(const dt of C.dates('2026-09'))C.markNoHomework(db,dt,'noHomework');C.touch(db,'2026-09-01').kind='school';C.addEntry(db,'2026-09-01','s2');const e=db.days['2026-09-01'].entries[0];C.setEntry(db,'2026-09-01',e.id,'assigned');C.setTask(db,'2026-09-01',e.id,e.tasks[0].id,'confirmed');C.review(db,'2026-09-01');db.months['2026-09']={gradesChecked:true};seenRaw=JSON.stringify(db);localStorage.setItem(KEY,seenRaw);month='2026-09';date='2026-09-01';page='month';render()`);click('[data-action="close-month"]');doc().getElementById('close-agree').checked=true;doc().getElementById('modal-form').requestSubmit();assert(exec("db.months['2026-09'].closed")===true);assert(exec("db.months['2026-09'].result.s")===2850);click('[data-action="pick-day"][data-date="2026-09-01"]');assert(!doc().querySelector('[data-action="task-status"]'));});
await test('Повторное открытие месяца сохраняет историю',()=>{click('[data-page="month"]');click('[data-action="reopen-month"]');assert(exec("db.months['2026-09'].closed")===false);assert(exec('db.history.length')===1);});
await test('Импорт исходной статистики сохраняет месячные записи и выплату',async()=>{click('[data-page="grades"]');const before=exec('JSON.stringify(C.calculate(db,month))'),fixture={format:'school-statistics-v1',snapshots:[{id:'browser-synthetic-statistics',asOf:'2026-10-13',period:'schoolYear',source:'Тестовые данные браузерной проверки',overallMean:4,classRank:3,subjectRows:[{name:'Тестовый предмет',mean:4,rank:3}],rankHistory:[]}]};const input=doc().getElementById('statistics-file'),dt=new DataTransfer();dt.items.add(new File([JSON.stringify(fixture)],'statistics.json',{type:'application/json'}));input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));await wait();assert(doc().getElementById('modal').open);doc().getElementById('modal-form').requestSubmit();assert(exec('db.referenceSnapshots.length')===1);assert(exec('JSON.stringify(C.calculate(db,month))')===before);assert(doc().body.textContent.includes('Тестовый предмет'));});
await test('Диалоги, тёмная тема и экран компьютера без переполнения',async()=>{for(const width of [375,390,1000]){frame.style.width=width+'px';click('[data-page="grades"]');click('[data-action="grade-new"]');await wait();const r=overflow();assert(r.scroll<=r.width);const b=doc().getElementById('modal').getBoundingClientRect();assert(b.width<=width&&b.left>=0);click('[data-action="modal-cancel"]');}click('[data-page="settings"]');field('theme','dark');assert(doc().documentElement.dataset.theme==='dark');});
summary.textContent=`Пройдено ${report.filter(x=>x.passed).length} из ${report.length}. Проверяются тестовые записи, семейные данные не изменены.`;frame.style.width='390px';const pre=document.createElement('pre');pre.textContent=JSON.stringify(report,null,2);output.append(pre);
}catch(e){summary.textContent='Проверка недоступна: '+e.message+'. Откройте страницу через локальный адрес сервера.';}finally{btn.disabled=false;}};
</script></body></html>
