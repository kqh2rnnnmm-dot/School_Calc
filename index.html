const initial=()=>{

function subject(db,s){return db.subjects.find(x=>x.id===s);}

function markNoHomework(db,date,kind){if(!['weekend','holiday','off','noHomework'].includes(kind))throw Error('Неизвестный тип дня');const d=touch(db,date);if(d.entries.some(e=>e.tasks.length))throw Error('В этом дне есть задания. Сначала проверьте их вручную.');d.kind=kind;for(const e of d.entries)e.state='none';d.reviewed=true;}

function settings(){return `<h1>Расписание и настройки</h1><div class="card"><h2>Резервные копии</h2><p class="small muted">Данные сохраняются в этом браузере автоматически. На iPhone и компьютере базы отдельные. Очистка браузера может удалить записи — регулярно сохраняйте JSON.</p><div class="actions">${button('Экспорт JSON','export','','primary')}${button('Импорт JSON','import')}</div><input id="import-file" type="file" accept="application/json,.json" hidden>${button('Скачать копию перед последним импортом','export-before','','link')}${initialError?`<div class="notice">${esc(initialError)}</div>${button('Скачать непрочитанные данные','raw-export')}${button('Начать новую базу','recover-new','','danger')}`:''}</div><div class="card"><h2>Правила и внешний вид</h2><label for="theme">Тема</label><select id="theme">${[['system','Как на устройстве'],['light','Светлая'],['dark','Тёмная']].map(([v,t])=>`<option value="${v}" ${v===db.settings.theme?'selected':''}>${t}</option>`).join('')}</select><label for="no-hw-policy">Если за месяц не было ни одного ДЗ</label><select id="no-hw-policy">${[['hold','Приостановить расчёт (по умолчанию)'],['zero','Зафиксировать выплату 0 ₽']].map(([v,t])=>`<option value="${v}" ${v===db.settings.noHomeworkPolicy?'selected':''}>${t}</option>`).join('')}</select><label class="checkline"><input type="checkbox" id="include-extra" ${db.settings.includeExtraHomework?'checked':''}><span>Учитывать ДЗ дополнительных занятий в выплате</span></label><p class="small muted">По умолчанию учитываются все заданные ДЗ. Оценки всех предметов всегда включены в средний балл. Настройки расчёта закрытых месяцев зафиксированы отдельно.</p><details><summary>Формулы начисления</summary><p class="small">До 4,5: P = 2850 × (G − 2) / 2,5.<br>От 4,5: P = 2850 + (G − 4,5) × 300.<br>Нет оценок: P = 2850.<br>K = подтверждённые / заданные ДЗ.<br>S = P × K, от 0 до 3000 ₽.</p></details></div><div class="card"><div class="split"><h2>Предметы</h2>${button('+ Предмет','subject-new')}</div>${db.subjects.map(s=>`<div class="split lesson"><span>${esc(s.name)}${s.extra?'<small class="muted"> · доп.</small>':''}</span>${button('✎','subject-edit',`data-id="${s.id}" aria-label="Редактировать предмет"`)}</div>`).join('')}</div><div class="card"><div class="split"><h2>Недельное расписание</h2>${button('+ Период','schedule-new')}</div><p class="small muted">Из PDF перенесена неделя 12–18 октября 2026: 30 основных уроков, 8 дополнительных занятий. Практикум и введение в информатику помечены как основные; это можно изменить. В пятницу по русскому языку указана КР. ДЗ из расписания не создаются.</p>${db.schedules.map(p=>`<details><summary>${p.from} — ${p.to}</summary><div class="actions">${button('Изменить','schedule-edit',`data-id="${p.id}"`)}${button('Повторить в новом периоде','schedule-copy',`data-id="${p.id}"`)}</div>${[1,2,3,4,5,6,0].map(i=>`<h3 style="margin-top:16px">${['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'][i]}</h3>${p.week[i].map(l=>`<p class="small">${esc(l.time)} · ${esc(subj(l.subjectId))}</p>`).join('')||'<p class="small muted">Занятий нет.</p>'}`).join('')}</details>`).join('')}</div><div class="footer-note">Школьный калькулятор v4.0 · Локальная семейная версия<br>Подтверждение родителя — явная отметка, без защиты PIN-кодом. Сервер, синхронизация и подключения к МЭШ не используются.</div>`;}
function render(){applyTheme();$('#save-state').textContent=initialError?'Нужна проверка данных':storageError?'Не сохранено':'✓ Сохранено на устройстве';$('#main').innerHTML=`${initialError||storageError?`<div class="notice" role="alert">${esc(initialError||storageError)}</div>`:''}${({home,homework,grades,month:monthView,settings}[page])()}`;document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false');});}
function navigate(p){page=p;render();window.scrollTo(0,0);}
function chooseDate(d){if(!C.dateOK(d))return;date=d;month=d.slice(0,7);hwTab='day';navigate('homework');}
function changeMonth(m){if(!C.monthOK(m))return;month=m;date=m+'-01';render();}
function openDialog(title,body,handler,buttons=''){modalHandler=handler;$('#modal-body').innerHTML=`<h2>${esc(title)}</h2>${body}<div id="form-error" role="alert" class="small danger"></div><div class="actions">${button('Отмена','modal-cancel')}<button type="submit" class="primary">Сохранить</button></div>${buttons}`;$('#modal').showModal();}
function val(id){return $('#'+id).value;}
function gradeDialog(g){const gd=g?.date|| (date.startsWith(month)?date:month+'-01');openDialog(g?'Изменить оценку':'Добавить оценку',`<label for="g-date">Дата получения</label><input id="g-date" type="date" required min="2000-01-01" max="2100-12-31" value="${gd}"><label for="g-subject">Предмет</label><select id="g-subject">${options(g?.subjectId)}</select><label for="g-value">Оценка</label><select id="g-value">${[5,4,3,2].map(v=>`<option ${v===g?.value?'selected':''}>${v}</option>`).join('')}</select><label for="g-comment">Комментарий (необязательно)</label><textarea id="g-comment" maxlength="1000">${esc(g?.comment||'')}</textarea>`,()=>{const item={id:g?.id,date:val('g-date'),subjectId:val('g-subject'),value:+val('g-value'),comment:val('g-comment').trim()};if(commit(d=>C.putGrade(d,item),'Оценка сохранена')){$('#modal').close();month=item.date.slice(0,7);date=item.date;navigate('grades');}},g?button('Удалить оценку','grade-delete',`data-id="${g.id}"`,'danger link'):'');}
function subjectDialog(s){openDialog(s?'Редактировать предмет':'Добавить предмет',`<label for="s-name">Название</label><input id="s-name" required maxlength="150" value="${esc(s?.name||'')}"><label class="checkline"><input type="checkbox" id="s-extra" ${s?.extra?'checked':''}>Дополнительное занятие</label><p class="small muted">Если есть закрытые месяцы, менять принадлежность предмета к дополнительным нельзя: создайте новый предмет.</p>`,()=>{const name=val('s-name').trim(),extra=$('#s-extra').checked;if(!name)throw Error('Введите название');if(commit(d=>{if(s){const target=C.subject(d,s.id);if(target.extra!==extra&&Object.values(d.months).some(m=>m.closed))throw Error('Сначала повторно откройте закрытые месяцы или создайте новый предмет');target.name=name;target.extra=extra;}else d.subjects.push({id:C.id(),name,extra});},'Предмет сохранён'))$('#modal').close();});}
function scheduleDialog(p,copy=false){const source=p?C.clone(p):{id:C.id(),from:date,to:C.moveDate(date,6),week:{0:[],1:[],2:[],3:[],4:[],5:[],6:[]}};if(copy){source.id=C.id();source.from=C.moveDate(p.to,1);source.to=C.moveDate(source.from,6);for(const arr of Object.values(source.week))for(const l of arr)l.id=C.id();}openDialog(copy?'Повторить расписание':p?'Редактировать расписание':'Новый период расписания',`<div class="notice">Явно задайте даты действия. Существующие записи ДЗ сохраняются; новое расписание применяется к ещё не заполненным дням.</div><label for="p-from">С даты</label><input required type="date" id="p-from" value="${source.from}"><label for="p-to">По дату включительно</label><input required type="date" id="p-to" value="${source.to}">${[1,2,3,4,5,6,0].map(i=>`<details><summary>${['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'][i]}</summary><div id="sched-${i}">${source.week[i].map(l=>scheduleRow(i,l)).join('')}</div>${button('+ Урок','schedule-row-new',`data-weekday="${i}"`,'link')}</details>`).join('')}`,()=>{source.from=val('p-from');source.to=val('p-to');if(!C.dateOK(source.from)||!C.dateOK(source.to)||source.from>source.to)throw Error('Проверьте даты периода');for(let i=0;i<7;i++)source.week[i]=[...document.querySelectorAll('#sched-'+i+' .schedule-row')].map(el=>({id:el.dataset.id,subjectId:el.querySelector('select').value,time:el.querySelector('input').value.trim()}));if(commit(d=>{if(d.schedules.some(x=>x.id!==source.id&&x.from<=source.to&&x.to>=source.from))throw Error('Периоды расписания не должны пересекаться');const k=d.schedules.findIndex(x=>x.id===source.id);if(k>=0)d.schedules[k]=source;else d.schedules.push(source);},'Расписание сохранено'))$('#modal').close();},p&&!copy?button('Удалить этот период','schedule-delete',`data-id="${p.id}"`,'danger link'):'');}
function scheduleRow(i,l={id:C.id(),subjectId:db.subjects[0].id,time:''}){return `<div class="schedule-row task" data-id="${l.id}"><select aria-label="Предмет урока">${options(l.subjectId)}</select><div class="row"><input style="flex:1;margin-top:8px" maxlength="40" aria-label="Время урока" placeholder="08:30–09:15" value="${esc(l.time)}">${button('×','schedule-row-remove','aria-label="Удалить урок"')}</div></div>`;}
function download(name,data){const blob=new Blob([data],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),20000);}
function exportDB(){download('school-backup-'+C.today()+'.json',JSON.stringify(db,null,2));notify('Резервная копия подготовлена для скачивания');}
const actions={
 'nav':b=>navigate(b.dataset.page),'today':()=>chooseDate(C.today()),'prev-month':()=>changeMonth(C.moveMonth(month,-1)),'next-month':()=>changeMonth(C.moveMonth(month,1)),'prev-day':()=>chooseDate(C.moveDate(date,-1)),'next-day':()=>chooseDate(C.moveDate(date,1)), 'pick-day':b=>chooseDate(b.dataset.date),'hw-tab':b=>{hwTab=b.dataset.tab;render();},
 'entry-status':b=>{const e=C.day(db,date).entries.find(e=>e.id===b.dataset.entry);if(e.tasks.length&&b.dataset.status!=='assigned'&&!confirm('Все задания этого предмета будут удалены из дня. Продолжить?'))return;commit(d=>C.setEntry(d,date,b.dataset.entry,b.dataset.status));},
 'entry-new':()=>openDialog('Добавить предмет в этот день',`<label for="entry-subject">Предмет</label><select id="entry-subject">${options()}</select>`,()=>{const sid=val('entry-subject');if(commit(d=>C.addEntry(d,date,sid)))$('#modal').close();}),
 'task-new':b=>openDialog('Ещё одно отдельное задание',`<label for="t-text">Описание (необязательно)</label><textarea id="t-text" maxlength="1000"></textarea>`,()=>{const t=val('t-text');if(commit(d=>C.addTask(d,date,b.dataset.entry,t)))$('#modal').close();}),
 'task-status':b=>commit(d=>C.setTask(d,b.dataset.date,b.dataset.entry,b.dataset.id,b.dataset.status),b.dataset.status==='confirmed'?'Подтверждено родителем':'Статус изменён'),
 'task-edit':b=>{const t=C.day(db,b.dataset.date).entries.find(e=>e.id===b.dataset.entry).tasks.find(t=>t.id===b.dataset.id);openDialog('Редактировать задание',`<label for="t-text">Описание</label><textarea id="t-text" maxlength="1000">${esc(t.text)}</textarea>`,()=>{const txt=val('t-text');if(commit(d=>C.editTask(d,b.dataset.date,b.dataset.entry,b.dataset.id,txt)))$('#modal').close();},button('Удалить задание','task-delete',`data-date="${b.dataset.date}" data-entry="${b.dataset.entry}" data-id="${t.id}"`,'danger link'));},
 'task-delete':b=>{if(!confirm('Удалить это задание? Оно перестанет входить в число заданных ДЗ.'))return;if(commit(d=>{const day=C.touch(d,b.dataset.date),e=day.entries.find(e=>e.id===b.dataset.entry);e.tasks=e.tasks.filter(t=>t.id!==b.dataset.id);if(!e.tasks.length)e.state='unknown';},'Задание удалено'))$('#modal').close();},
 'review-day':()=>commit(d=>C.review(d,date),'Полнота дня проверена'),
 'no-homework':()=>{const d=C.day(db,date);if(d.entries.some(e=>e.tasks.length)){notify('Есть записанные задания: проверьте их вручную.');return;}if(!confirm('Подтверждаете, что в этот день не было новых домашних заданий ни по одному предмету?'))return;commit(db=>C.markNoHomework(db,date,d.kind==='school'?'noHomework':d.kind),'День без новых ДЗ отмечен');},
 'no-hw-range':()=>openDialog('Дни без новых домашних заданий',`<label for="r-from">С даты</label><input type="date" id="r-from" required value="${date}"><label for="r-to">По дату</label><input type="date" id="r-to" required value="${date}"><label for="r-kind">Причина</label><select id="r-kind"><option value="weekend">Выходные</option><option value="holiday">Каникулы</option><option value="off">Нет занятий</option><option value="noHomework">Не задавали ДЗ</option></select><label class="checkline"><input type="checkbox" id="r-weekends">Только субботы и воскресенья</label><p class="small muted">Подтвердите, что в выбранные дни не задавали новых ДЗ. Дни с записанными заданиями и закрытые месяцы будут пропущены.</p>`,()=>{const from=val('r-from'),to=val('r-to'),kind=val('r-kind'),weekends=$('#r-weekends').checked;if(!C.dateOK(from)||!C.dateOK(to)||from>to)throw Error('Проверьте даты');let list=[],d=from;while(d<=to&&list.length<=366){if(!weekends||[0,6].includes(new Date(d+'T12:00:00').getDay()))list.push(d);d=C.moveDate(d,1);if((new Date(d)-new Date(from))/86400000>366)throw Error('Выберите диапазон не более года');}const allowed=list.filter(dt=>!locked(dt)&&!C.day(db,dt).entries.some(e=>e.tasks.length));if(!allowed.length)throw Error('Нет подходящих дней');if(!confirm(`Отметить отсутствие новых ДЗ: ${allowed.length} дней. Пропущено: ${list.length-allowed.length}.`))return;if(commit(d=>allowed.forEach(dt=>C.markNoHomework(d,dt,kind)),`Отмечено дней: ${allowed.length}`))$('#modal').close();}),
 'grade-new':()=>gradeDialog(),'grade-edit':b=>gradeDialog(db.grades.find(g=>g.id===b.dataset.id)), 'grade-delete':b=>{if(!confirm('Удалить оценку? Средний балл и предварительная выплата изменятся.'))return;if(commit(d=>C.removeGrade(d,b.dataset.id),'Оценка удалена'))$('#modal').close();},
 'close-month':()=>{const issues=C.closingIssues(db,month);if(issues.length){notify(issues.join(' '));return;}const r=C.calculate(db,month);openDialog('Закрыть '+monthName(month),`${formula(r)}<p>Будет зафиксировано ${rub(r.s)}. Не подтверждённые задания (${r.pending}) и невыполненные (${r.todo}) не засчитаны. Для изменения потребуется повторно открыть месяц.</p><label class="checkline"><input type="checkbox" id="close-agree" required>Я проверил домашние задания и оценки. Подтверждаю итог.</label>`,()=>{if(!$('#close-agree').checked)throw Error('Подтвердите итог');if(commit(d=>C.closeMonth(d,month),'Месяц закрыт',false))$('#modal').close();});},
 'reopen-month':()=>{if(confirm('Повторно открыть месяц? Предыдущий итог останется в истории, а текущая сумма снова станет предварительной.'))commit(d=>C.reopen(d,month),'Месяц открыт повторно',false);},
 'history-month':b=>{changeMonth(b.dataset.month);navigate('month');},'subject-new':()=>subjectDialog(),'subject-edit':b=>subjectDialog(C.subject(db,b.dataset.id)), 'schedule-new':()=>scheduleDialog(),'schedule-edit':b=>scheduleDialog(db.schedules.find(x=>x.id===b.dataset.id)),'schedule-copy':b=>scheduleDialog(db.schedules.find(x=>x.id===b.dataset.id),true),
 'schedule-row-new':b=>$('#sched-'+b.dataset.weekday).insertAdjacentHTML('beforeend',scheduleRow(b.dataset.weekday)), 'schedule-row-remove':b=>b.closest('.schedule-row').remove(), 'schedule-delete':b=>{if(confirm('Удалить этот период расписания? Записи домашних заданий останутся.'))if(commit(d=>d.schedules=d.schedules.filter(p=>p.id!==b.dataset.id)))$('#modal').close();},
 'export':exportDB,'import':()=>$('#import-file').click(),'export-before':()=>{try{const raw=localStorage.getItem(PREIMPORT);if(!raw)throw Error('Копии перед импортом пока нет');download('school-before-import.json',raw);}catch(e){notify(e.message);}},'raw-export':()=>{const raw=localStorage.getItem(KEY);if(raw)download('school-unread-data.json',raw);},
 'recover-new':()=>{if(prompt('Чтобы начать заново, введите НОВАЯ БАЗА. Сначала скачайте непрочитанные данные.')!=='НОВАЯ БАЗА')return;try{const raw=localStorage.getItem(KEY);if(raw){download('school-unread-data.json',raw);localStorage.setItem(PREIMPORT,raw);}db=C.initial();seenRaw=JSON.stringify(db);localStorage.setItem(KEY,seenRaw);initialError='';render();}catch(e){notify(e.message);}},
 'undo':()=>{if(!undo)return;const previous=undo;commit(d=>{for(const k of Object.keys(d))delete d[k];Object.assign(d,previous);},'Действие отменено',false);},'modal-cancel':()=>$('#modal').close()
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;try{actions[b.dataset.action]?.(b);}catch(err){notify(err.message);}});
document.addEventListener('change',async e=>{const el=e.target;
 if(el.id==='month-picker')changeMonth(el.value);else if(el.id==='day-picker')chooseDate(el.value);
 else if(el.id==='day-kind')commit(d=>C.touch(d,date).kind=el.value);
 else if(el.id==='theme')commit(d=>d.settings.theme=el.value,'Тема сохранена');
 else if(el.id==='no-hw-policy')commit(d=>d.settings.noHomeworkPolicy=el.value,'Правило сохранено');
 else if(el.id==='include-extra')commit(d=>d.settings.includeExtraHomework=el.checked,'Правило сохранено');
 else if(el.id==='grades-checked')commit(d=>{C.editable(d,month+'-01');d.months[month]={closed:false,gradesChecked:el.checked};},'Проверка оценок отмечена');
 else if(el.id==='import-file'&&el.files[0]){try{const file=el.files[0];if(file.size>20*1024*1024)throw Error('Файл больше 20 МБ');const raw=await file.text();importCandidate=C.validate(JSON.parse(raw));const data=importCandidate;openDialog('Восстановить резервную копию',`<p>В копии: ${data.grades.length} оценок, ${Object.keys(data.days).length} заполненных дней, ${data.history.length} закрытий.</p><div class="notice">Импорт полностью заменит текущую базу. Её копия сохранится отдельно на этом устройстве и будет доступна в настройках.</div><label class="checkline"><input type="checkbox" id="import-agree" required>Подтверждаю замену текущей базы</label>`,()=>{if(!$('#import-agree').checked)throw Error('Подтвердите замену');const old=localStorage.getItem(KEY);if(old!==seenRaw&&!initialError)throw Error('База изменилась в другой вкладке. Закройте диалог и повторите импорт.');if(old)localStorage.setItem(PREIMPORT,old);data.revision=Math.max(data.revision,db.revision)+1;const next=JSON.stringify(C.validate(data));localStorage.setItem(KEY,next);db=C.clone(data);seenRaw=next;initialError='';storageError='';undo=null;$('#modal').close();render();notify('Резервная копия восстановлена');});}catch(err){notify('Импорт отклонён: '+err.message);}el.value='';}
});
$('#modal-form').addEventListener('submit',e=>{e.preventDefault();try{modalHandler?.();}catch(err){$('#form-error').textContent=err.message;}});
window.addEventListener('storage',e=>{if(e.key===KEY){try{if(!e.newValue)throw Error('База удалена другой вкладкой');db=C.validate(JSON.parse(e.newValue));seenRaw=e.newValue;undo=null;initialError='';$('#modal').close();render();notify('Данные обновлены из другой вкладки');}catch(err){initialError='Данные другой вкладки не удалось прочитать. Сохраните резервную копию.';render();}}});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
load();
</script></body></html>
